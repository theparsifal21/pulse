<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PULSE</title><meta name="theme-color" content="#100e10"><link rel="icon" href="logo.svg"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=7"><style>body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.logo{font-size:26px;font-weight:800;letter-spacing:.5px;gap:0}#main{background:var(--bg)}@media(min-width:761px){#app{grid-template-columns:210px 1fr}}</style></head><body>
<div id="app"><aside id="side"><div class="logo">PULSE<span class="brand-dot">.</span></div><nav id="nav"></nav><div class="plh"><span>Playlists</span><button id="newpl" data-a="newpl" aria-label="Create playlist">＋</button></div><nav id="pls"></nav></aside><main id="main" tabindex="-1"></main></div>
<footer id="player"><div class="np"><div class="cov" id="cv">♪</div><div class="m"><b id="tt">Nothing playing</b><span id="ta">Import music to start</span></div><button id="lk" aria-label="Like">♥</button></div>
<div class="ctl"><div class="btns"><button id="sh" aria-label="Shuffle">⇄</button><button id="pv" aria-label="Previous">⏮</button><button id="pp" class="big" aria-label="Play/Pause">▶</button><button id="nx" aria-label="Next">⏭</button><button id="rp" aria-label="Repeat">↻</button></div><div class="seek"><span id="cu">0:00</span><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="du">0:00</span></div></div>
<div class="vol"><button id="mu" aria-label="Mute">🔊</button><input id="vl" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div></footer>
<input id="fb" type="file" accept="application/json,.json" hidden><audio id="a" preload="metadata"></audio><input id="fi" type="file" accept="audio/*,.flac,.m4a,.aac" multiple hidden><input id="fd" type="file" webkitdirectory multiple hidden>
<script src="core.js"></script><script src="meta.js"></script><script>(()=>{const accents=["#9065ff","#3b82f6","#E5484D","#f97316","#22c55e","#ec4899","#f59e0b"],labels={default:"Default",midnight:"Midnight blue",oled:"Pure black",warm:"Warm brown",forest:"Forest"},bgs={default:["#100e10","#1d191c","#292226","#392e34"],midnight:["#0b1020","#131a2e","#1b2440","#26304f"],oled:["#000000","#0d0d10","#17171c","#232329"],warm:["#15110f","#1e1815","#2a221e","#382e28"],forest:["#0c1411","#141f1b","#1d2c26","#2a3d35"]};let state={acc:accents[0],bg:"default"};try{const s=JSON.parse(localStorage.getItem("pulse-colors"));if(s&&/^#[0-9a-f]{6}$/i.test(s.acc)&&Object.hasOwn(bgs,s.bg))state=s}catch{}function apply(){const r=document.documentElement.style;r.setProperty("--ac",state.acc);r.setProperty("--ach","#"+state.acc.slice(1).match(/../g).map(x=>Math.round(parseInt(x,16)*.72).toString(16).padStart(2,"0")).join(""));r.setProperty("--ac2",state.acc);["--bg","--bg2","--bg3","--bd"].forEach((k,i)=>r.setProperty(k,bgs[state.bg][i]));try{localStorage.setItem("pulse-colors",JSON.stringify(state))}catch{}}window.pulseColors={accents,labels,state,apply};apply()})();</script><script src="app.js?v=9"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))</script></body></html>
